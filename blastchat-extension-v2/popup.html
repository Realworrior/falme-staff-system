<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BlastChat Matrix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: rgba(10, 10, 12, 0.85);
      --surface: rgba(20, 20, 24, 0.92);
      --card-bg: #1e1f22;
      --border: rgba(255,255,255,0.08);
      --orange: #baff55;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      min-height: 520px;
      max-height: 600px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    @media (min-width: 480px) {
      body {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }

    /* HEADER */
    header {
      flex-shrink: 0;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: #baff55;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h1 {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-text p {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* CONTROLS */
    .sticky-controls {
      flex-shrink: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.1);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 8px;
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 9px 12px 9px 36px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    #search-input:focus {
      border-color: rgba(186,255,85,0.5);
      background: rgba(186,255,85,0.04);
    }

    #search-input::placeholder { color: var(--text-muted); }

    .category-dropdown-wrapper {
      position: relative;
    }

    .category-dropdown-wrapper::after {
      content: '▼';
      font-size: 8px;
      color: var(--text-muted);
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    #category-select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 9px 24px 9px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      appearance: none;
      cursor: pointer;
      font-family: inherit;
    }

    #category-select option {
      background-color: #1e1f22;
      color: #ffffff;
    }

    #category-select:focus {
      border-color: rgba(186,255,85,0.5);
    }

    .shortcuts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .shortcut-tag {
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }

    .shortcut-tag:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .shortcut-tag.active { background: rgba(186,255,85,0.12); color: #baff55; border-color: rgba(186,255,85,0.3); }

    /* CONTENT */
    #content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .template-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }

    @media (min-width: 600px) {
      .template-stack {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .template-stack {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .template-stack {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* CATEGORY CARD — cloned from Templates.jsx */
    .matrix-card {
      background: #1e1f22;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 14px 8px;
    }

    .card-icon-box {
      width: 34px;
      height: 34px;
      background: #2a2b2f;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card-count-badge {
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 64px;
      margin-top: -2px;
      margin-right: -2px;
    }

    .count-number {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .count-label {
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 2px;
      opacity: 0.7;
    }

    .count-status {
      margin-top: 4px;
      padding: 1px 8px;
      border-radius: 20px;
      font-size: 7px;
      font-weight: 700;
    }

    .card-labels {
      padding: 0 14px 12px;
    }

    .card-type-label {
      font-size: 9px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 2px;
    }

    .card-category-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .card-divider {
      height: 1px;
      background: #2a2b2f;
      margin: 0 14px;
    }

    /* TEMPLATE ROW */
    .template-row-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(42,43,47,0.5);
      cursor: pointer;
      text-align: left;
      color: #c0c0c5;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s;
      font-family: inherit;
    }

    .template-row-header:hover { background: rgba(255,255,255,0.02); }

    .template-row-header:last-of-type { border-bottom: none; }

    .row-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .row-title { flex: 1; }

    .row-arrow { flex-shrink: 0; font-size: 10px; color: #4a4b50; }

    /* EXPANDED CONTENT */
    .expanded-content {
      padding: 0 14px 14px;
      display: none;
    }

    .expanded-content.open { display: block; }

    .variant-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .variant-label {
      font-size: 9px;
      color: #8e8e93;
      font-weight: 600;
      margin-right: 2px;
    }

    .variant-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #3a3b3f;
      background: transparent;
      color: #8e8e93;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-family: inherit;
    }

    .variant-btn.active { color: #000; border-color: transparent; }

    .response-block {
      background: #161616;
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      color: #c0c0c5;
      line-height: 1.6;
      border: 1px solid #3a3b3f;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
      font-family: 'Courier New', Courier, monospace;
    }

    .var-highlight { font-weight: 700; }
    .danger-highlight { color: #ff4d4d; font-weight: 700; }
    .success-highlight { color: #00e676; font-weight: 700; }
    .info-highlight { color: #4080ff; font-weight: 700; }
    .data-highlight { color: #ffea00; font-weight: 700; }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-edit, .action-delete {
      font-size: 11px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.15s;
      font-family: inherit;
    }

    .action-edit { color: #8e8e93; }
    .action-edit:hover { color: #fff; }
    .action-delete { color: #ff4d4d; }
    .action-delete:hover { color: #ff6b6b; }

    .action-copy {
      margin-left: auto;
      padding: 5px 14px;
      border-radius: 20px;
      border: 2px solid;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    /* ERROR / EMPTY */
    #error-toast {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(239,68,68,0.9);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      display: none;
      z-index: 1000;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    #status-text {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <div class="brand">
        <div class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>BlastChat Matrix</h1>
          <p>Intelligence Platform · v1.7</p>
        </div>
      </div>
      <div id="status-text">Syncing…</div>
    </div>
  </header>

  <div class="sticky-controls">
    <div class="controls-grid">
      <div class="search-input-wrapper">
        <div class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <input type="text" id="search-input" placeholder="Search templates…" autocomplete="off">
      </div>
      <div class="category-dropdown-wrapper">
        <select id="category-select">
          <option value="ALL">All Categories</option>
        </select>
      </div>
    </div>
    <div class="shortcuts-row" id="shortcuts-row"></div>
  </div>

  <div id="content-scroll">
    <div id="templates" class="template-stack">
      <div class="empty-state">Initializing…</div>
    </div>
  </div>

  <div id="error-toast"></div>
  <script src="popup.js"></script>
</body>
</html>
