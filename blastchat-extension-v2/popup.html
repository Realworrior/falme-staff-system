<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BlastChat Matrix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@500;800&display=swap');

    :root {
      --bg: #2b3640; /* HubSpot Dark Slate */
      --surface: #33404d; /* Lighter Slate for Cards */
      --border: #425b76;
      --orange: #ff7a59; /* HubSpot Orange */
      --orange-dim: rgba(255, 122, 89, 0.15);
      --text: #ffffff;
      --text-muted: #cbd6e2;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }

    body { 
      width: 640px; 
      height: 600px;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif; 
      background: var(--bg);
      color: var(--text); 
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--orange); }

    /* HEADER */
    header {
      flex-shrink: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 122, 89, 0.3);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .brand-text p {
      margin: 0;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* STICKY NAV SECTION */
    .sticky-controls {
      flex-shrink: 0;
      background: var(--bg);
      padding: 16px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      width: 100%;
    }

    /* SEARCH */
    .search-input-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .search-input-wrapper:focus-within .search-icon {
      color: var(--orange);
    }

    #search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px 12px 42px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    #search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    #search-input:focus {
      border-color: var(--orange);
      background: var(--bg);
      box-shadow: 0 0 0 3px var(--orange-dim);
    }

    /* DROPDOWN & WRAP FIX */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      align-items: center;
    }

    .category-dropdown-wrapper {
      position: relative;
    }

    #category-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 16px;
      color: #fff;
      font-size: 13px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    #category-select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-dim);
    }

    .dropdown-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
    }

    .shortcuts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .shortcut-tag {
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shortcut-tag:hover {
      background: var(--border);
      color: #fff;
    }

    .shortcut-tag.active {
      background: var(--orange-dim);
      color: var(--orange);
      border-color: var(--orange);
    }

    /* CONTENT AREA */
    #content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .template-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* CARD DESIGN */
    .matrix-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .card-meta-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .response-text {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd6e2;
      white-space: pre-wrap;
      background: var(--bg);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .copy-btn {
      width: fit-content;
      background: var(--orange);
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #e56a4d;
    }

    /* HIGHLIGHTS */
    .var-highlight {
      color: var(--orange);
      font-weight: 600;
    }
    .danger-highlight { color: #f2545b; font-weight: 600; }
    .success-highlight { color: #00bda5; font-weight: 600; }
    .info-highlight { color: #00a4bd; font-weight: 600; }
    .data-highlight { color: #f5c26b; font-weight: 600; }

    #error-toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #f2545b;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 1000;
      text-align: center;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <div class="brand">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>BlastChat Matrix</h1>
          <p>Intelligence Platform</p>
        </div>
      </div>
      <div style="font-size: 9px; font-weight: 900; color: var(--text-muted); text-transform: uppercase;" id="status-text">
        Ready
      </div>
    </div>
  </header>

  <div class="sticky-controls">
    <div class="controls-grid">
      <div class="search-input-wrapper">
        <div class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <input type="text" id="search-input" placeholder="Search Intelligence..." autocomplete="off">
      </div>

      <div class="category-dropdown-wrapper">
        <select id="category-select">
          <option value="ALL">All Categories</option>
          <!-- Options injected here -->
        </select>
        <div class="dropdown-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="shortcuts-row" id="shortcuts-row">
      <!-- Keywords injected here -->
    </div>
  </div>

  <div id="content-scroll">
    <div id="templates" class="template-stack">
      <div class="empty-state">Initializing Neural Sync...</div>
    </div>
  </div>

  <div id="error-toast"></div>
  <script src="popup.js"></script>
</body>
</html>
